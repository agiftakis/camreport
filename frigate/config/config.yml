mqtt:
  enabled: false
detectors:
  onnx:
    type: onnx
model:
  model_type: yolo-generic
  width: 320
  height: 320
  input_tensor: nchw
  input_dtype: float
  path: /config/model_cache/yolov9-s-320.onnx
  labelmap_path: /labelmap/coco-80.txt
ffmpeg:
  hwaccel_args: preset-nvidia
genai:
  nitro_ollama:
    provider: ollama
    base_url: http://host.docker.internal:11434
    model: qwen3-vl:4b
    roles:
      - descriptions
    provider_options:
      keep_alive: -1
      options:
        num_ctx: 16384
objects:
  genai:
    prompt: >-
      You are writing a factual observation for a security incident log from the
      camera named {camera}. The images are frames from one recording, in time
      order from first to last. Describe only what is visible: the {label},
      where it is in the frame, and how its position and posture change from the
      first frame to the last. Rules: plain text only, no markdown, no bullet
      points, no headings. Maximum three sentences. Do not guess intent,
      purpose, emotion, or what may happen next. Do not describe the room or
      background unless the {label} is interacting with it. If something is
      unclear, say it is unclear rather than guessing.
    object_prompts:
      person: >-
        You are writing a factual observation for a security incident log from
        the camera named {camera}. The images are frames from one recording, in
        time order from first to last. In plain text, maximum ten sentences,
        no markdown or lists: state how many people are visible, where the main
        person is in the frame, their approximate clothing colours, and how
        their body, arms and hands move across the frames. If the arms or hands
        move rapidly, repeatedly, or are extended toward the camera or toward
        another person, state that plainly. Do not guess intent, purpose, mood,
        or what they might do next. Do not describe the background. If the
        person is partially out of frame or blurred, say so.
go2rtc:
  streams:
    testcam:
      - ffmpeg:virtual?video&size=1280x720#video=h264
    phone:
      - ffmpeg:http://10.1.10.75:8080/video#video=h264
cameras:
  testcam:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/testcam
          input_args: preset-rtsp-restream
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 5
    record:
      enabled: true
      continuous:
        days: 1
  phone:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/phone
          input_args: preset-rtsp-restream
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 5
    objects:
      track:
        - person
      genai:
        enabled: true
        use_snapshot: false
        objects:
          - person
    record:
      enabled: true
      continuous:
        days: 1
    snapshots:
      enabled: true
version: 0.18-0